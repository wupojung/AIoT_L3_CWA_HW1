name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repository-baseline:
    name: Repository Baseline
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify required project files
        run: |
          test -f README.md
          test -f myplan/workflow.md
          test -f docs/architecture.md
          test -f docs/testing.md
          test -f .env.example
          test -f .gitignore

      - name: Verify .env is not tracked
        run: |
          if git ls-files --error-unmatch .env >/dev/null 2>&1; then
            echo "ERROR: .env must not be tracked."
            exit 1
          fi

      - name: Verify CWA secret placeholder
        run: |
          grep -q '^CWA_API_KEY=<YOUR_CWA_API_KEY>$' .env.example

  powershell-tests:
    name: PowerShell / Pester
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Pester 6.2.0
        shell: pwsh
        run: |
          Install-Module Pester -RequiredVersion 6.2.0 -Scope CurrentUser -Force
          Import-Module Pester -RequiredVersion 6.2.0 -Force
          Get-Module Pester

      - name: Run Pester Tests
        shell: pwsh
        run: |
          Invoke-Pester -Path ./tests -CI -Output Detailed
