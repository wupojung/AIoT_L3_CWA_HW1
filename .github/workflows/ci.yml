name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repository-baseline:
    name: Repository Baseline
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify required project files
        run: |
          test -f README.md
          test -f myplan/workflow.md
          test -f docs/architecture.md
          test -f docs/testing.md
          test -f .env.example
          test -f .gitignore
          test -f .github/workflows/gate1-api.yml
          test -f .github/workflows/gate2-integration.yml
          test -f .github/workflows/gate3-gis.yml

      - name: Verify .env is not tracked
        run: |
          if git ls-files --error-unmatch .env >/dev/null 2>&1; then
            echo "ERROR: .env must not be tracked."
            exit 1
          fi

      - name: Verify CWA secret placeholder
        run: |
          grep -q '^CWA_API_KEY=<YOUR_CWA_API_KEY>$' .env.example

  powershell-tests:
    name: PowerShell / Pester
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Pester 6.2.0
        shell: pwsh
        run: |
          Install-Module Pester -RequiredVersion 6.2.0 -Scope CurrentUser -Force
          Import-Module Pester -RequiredVersion 6.2.0 -Force
          Get-Module Pester

      - name: Run Pester Tests
        shell: pwsh
        run: |
          Invoke-Pester -Path ./tests -CI -Output Detailed

  frontend-tests:
    name: Frontend Vitest & Build
    runs-on: ubuntu-latest
    
    defaults:
      run:
        working-directory: ./web

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: './web/package-lock.json'

      - name: Install Dependencies
        run: npm ci

      - name: Type Check
        run: npx tsc --noEmit

      - name: Run Vitest
        run: npm run test -- --run

      - name: Vite Build
        run: npm run build
