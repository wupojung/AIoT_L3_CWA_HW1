<!DOCTYPE html>
<html lang="zh-TW">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TW Sky｜島嶼氣象圖譜</title>
    <meta name="description" content="TW Sky 島嶼氣象圖譜，以互動地圖呈現台灣即時氣象觀測資料，探索全台觀測站的氣溫、濕度與天氣現象。資料來源為中央氣象署開放資料。" />
    <meta name="keywords" content="TW Sky, 台灣天氣, 台灣氣象, 島嶼氣象圖譜, 即時天氣, 中央氣象署, CWA, weather map, Taiwan weather, weather atlas" />
    <link rel="canonical" href="https://twsky.vercel.app/" />
    
    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="TW Sky｜島嶼氣象圖譜" />
    <meta property="og:description" content="一張地圖，看見全台即時天氣。探索全台觀測站的氣溫、濕度與天氣現象。" />
    <meta property="og:url" content="https://twsky.vercel.app/" />
    <meta property="og:site_name" content="TW Sky" />
    <meta property="og:locale" content="zh_TW" />
    
    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="TW Sky｜島嶼氣象圖譜" />
    <meta name="twitter:description" content="一張地圖，看見全台即時天氣。" />

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="" />
  </head>
  <body>
    <div id="app">

      <!-- ── Loading / Error Overlay ─────────────────────────────────────── -->
      <div id="status-overlay" class="overlay">
        <div class="spinner"></div>
        <div class="message" id="status-message">正在載入氣象觀測資料…</div>
      </div>

      <!-- ── Full-screen Map ────────────────────────────────────────────── -->
      <div id="map"></div>

      <!-- ── Top-left Header ───────────────────────────────────────────── -->
      <header class="app-header" aria-label="應用程式標題">
        <div class="header-brand">TW Sky</div>
        <h1 class="header-product" id="ui-product-name">島嶼氣象圖譜</h1>
        <div class="header-tagline" id="ui-tagline">一張地圖，看見全台即時天氣。</div>
        
        <div class="header-meta">
          <span class="header-badge"><span id="station-count">--</span> <span id="ui-stations">個觀測站</span></span>
          <span class="header-badge"><span id="ui-updated">更新於</span> <span id="last-updated">--:--</span></span>
        </div>
        
        <div class="header-footer" id="ui-datasource">資料來源 · 中央氣象署</div>
        
        <button id="lang-toggle" class="lang-toggle-btn" aria-label="Language switch">中文 | EN</button>
      </header>

      <!-- ── Right-side Layer Panel ─────────────────────────────────────── -->
      <aside id="layer-panel" class="layer-panel" aria-label="地圖圖層">

        <div class="panel-header">
          <span class="panel-title" id="ui-label-layers">地圖圖層</span>
        </div>

        <!-- Base Map section -->
        <div class="panel-section">
          <div class="panel-section-label" id="ui-label-basemap">底圖</div>
          <div class="theme-switch-wrapper">
            <input type="radio" name="basemap" id="basemap-dark" value="dark" checked aria-label="深色底圖" />
            <label for="basemap-dark" class="theme-switch-label" id="ui-label-dark">深色</label>
            
            <input type="radio" name="basemap" id="basemap-light" value="light" aria-label="淺色底圖" />
            <label for="basemap-light" class="theme-switch-label" id="ui-label-light">淺色</label>
            
            <div class="theme-switch-slider"></div>
          </div>
        </div>

        <div class="panel-divider"></div>

        <!-- Data Layer section -->
        <div class="panel-section">
          <div class="panel-section-label" id="ui-label-datalayer">氣象資料</div>
          <label class="radio-row" id="layer-temp-label">
            <input type="radio" name="datalayer" id="layer-temp" value="temperature" checked aria-label="氣溫圖層" />
            <span class="radio-dot"></span>
            <span id="ui-label-temp">氣溫</span>
          </label>
          <label class="radio-row" id="layer-hum-label">
            <input type="radio" name="datalayer" id="layer-hum" value="humidity" aria-label="相對濕度圖層" />
            <span class="radio-dot"></span>
            <span id="ui-label-hum">相對濕度</span>
          </label>
          <label class="radio-row" id="layer-wx-label">
            <input type="radio" name="datalayer" id="layer-wx" value="weather" aria-label="天氣現象圖層" />
            <span class="radio-dot"></span>
            <span id="ui-label-wx">天氣現象</span>
          </label>
          <label class="radio-row" id="layer-wind-label">
            <input type="radio" name="datalayer" id="layer-wind" value="windSpeed" aria-label="陣風/風速圖層" />
            <span class="radio-dot"></span>
            <span id="ui-label-wind">陣風/風速</span>
          </label>
          <label class="radio-row" id="layer-pressure-label">
            <input type="radio" name="datalayer" id="layer-pressure" value="pressure" aria-label="氣壓圖層" />
            <span class="radio-dot"></span>
            <span id="ui-label-pressure">氣壓</span>
          </label>
          <label class="radio-row" id="layer-uv-label">
            <input type="radio" name="datalayer" id="layer-uv" value="uvIndex" aria-label="紫外線圖層" />
            <span class="radio-dot"></span>
            <span id="ui-label-uv">紫外線</span>
          </label>
          <label class="radio-row" id="layer-precip-label">
            <input type="radio" name="datalayer" id="layer-precip" value="precipitation" aria-label="降雨量圖層" />
            <span class="radio-dot"></span>
            <span id="ui-label-precip">降雨量</span>
          </label>
        </div>

      </aside>

      <!-- ── Station Detail Drawer ──────────────────────────────────────── -->
      <div id="station-detail" class="station-detail" aria-label="測站詳情" hidden>
        <div class="station-detail-header">
          <span class="station-detail-title" id="sd-title">測站詳情</span>
          <button id="station-detail-close" class="station-detail-close" aria-label="關閉">✕</button>
        </div>
        <div id="station-detail-content" class="station-detail-content"></div>
      </div>

      <!-- ── Mobile Panel Toggle ────────────────────────────────────────── -->
      <button id="panel-toggle" class="panel-toggle-btn" aria-label="切換圖層面板" aria-expanded="false">
        <span id="ui-label-toggle-panel">地圖圖層</span>
      </button>

      <!-- ── Bottom-left Legend ─────────────────────────────────────────── -->
      <div id="legend" class="legend-panel" aria-label="地圖圖例"></div>

    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
