<!DOCTYPE html>
<html lang="zh-TW">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Taiwan Weather GIS — Current Observations</title>
    <meta name="description" content="Real-time Taiwan weather station observations visualised on an interactive GIS map. Data sourced from CWA Open Data." />
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="" />
  </head>
  <body>
    <div id="app">

      <!-- ── Loading / Error Overlay ─────────────────────────────────────── -->
      <div id="status-overlay" class="overlay">
        <div class="spinner"></div>
        <div class="message" id="status-message">Loading observations...</div>
      </div>

      <!-- ── Full-screen Map ────────────────────────────────────────────── -->
      <div id="map"></div>

      <!-- ── Top-left Header ───────────────────────────────────────────── -->
      <header class="app-header" aria-label="Application title">
        <h1>Taiwan Weather GIS</h1>
        <div class="header-subtitle">Current Weather Observation</div>
        <div class="header-meta">
          <span id="station-count" class="header-badge"></span>
          <span id="last-updated" class="header-badge"></span>
          <button id="lang-toggle" class="header-badge" style="cursor:pointer; background-color:#3b82f6; border:none; color:white; font-family:inherit;">🇹🇼 中文</button>
        </div>
      </header>

      <!-- ── Right-side Layer Panel ─────────────────────────────────────── -->
      <aside id="layer-panel" class="layer-panel" aria-label="Layer controls">

        <div class="panel-header">
          <span class="panel-title" id="ui-label-layers">Layers</span>
        </div>

        <!-- Base Map section -->
        <div class="panel-section">
          <div class="panel-section-label" id="ui-label-basemap">BASE MAP</div>
          <div class="theme-switch-wrapper">
            <input type="radio" name="basemap" id="basemap-dark" value="dark" checked aria-label="Dark basemap" />
            <label for="basemap-dark" class="theme-switch-label" id="ui-label-dark">Dark</label>
            
            <input type="radio" name="basemap" id="basemap-light" value="light" aria-label="Light basemap" />
            <label for="basemap-light" class="theme-switch-label" id="ui-label-light">Light</label>
            
            <div class="theme-switch-slider"></div>
          </div>
        </div>

        <div class="panel-divider"></div>

        <!-- Data Layer section -->
        <div class="panel-section">
          <div class="panel-section-label" id="ui-label-datalayer">DATA LAYER</div>
          <label class="radio-row" id="layer-temp-label">
            <input type="radio" name="datalayer" id="layer-temp" value="temperature" checked aria-label="Temperature layer" />
            <span class="radio-dot"></span>
            <span id="ui-label-temp">🌡 Temperature</span>
          </label>
          <label class="radio-row" id="layer-hum-label">
            <input type="radio" name="datalayer" id="layer-hum" value="humidity" aria-label="Humidity layer" />
            <span class="radio-dot"></span>
            <span id="ui-label-hum">💧 Humidity</span>
          </label>
          <label class="radio-row" id="layer-wx-label">
            <input type="radio" name="datalayer" id="layer-wx" value="weather" aria-label="Weather condition layer" />
            <span class="radio-dot"></span>
            <span id="ui-label-wx">⛅ Weather</span>
          </label>
          <label class="radio-row" id="layer-wind-label">
            <input type="radio" name="datalayer" id="layer-wind" value="windSpeed" aria-label="Wind speed layer" />
            <span class="radio-dot"></span>
            <span id="ui-label-wind">💨 Wind Speed</span>
          </label>
          <label class="radio-row" id="layer-precip-label">
            <input type="radio" name="datalayer" id="layer-precip" value="precipitation" aria-label="Precipitation layer" />
            <span class="radio-dot"></span>
            <span id="ui-label-precip">☔ Precipitation</span>
          </label>
        </div>

      </aside>

      <!-- ── Mobile Panel Toggle ────────────────────────────────────────── -->
      <button id="panel-toggle" class="panel-toggle-btn" aria-label="Toggle layer panel" aria-expanded="false">
        ⊞ Layers
      </button>

      <!-- ── Bottom-left Legend ─────────────────────────────────────────── -->
      <div id="legend" class="legend-panel" aria-label="Map legend"></div>

    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
